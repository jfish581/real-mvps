<style>
  html,body{margin:0;height:100%;background:#0A0606;color:#F4E9D2;font-family:Georgia,serif}
  body{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  iframe{display:block;border:0;width:100%;height:100%;background:#0A0606}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0A0606;transition:opacity .4s;text-align:center;padding:24px}
  #splash img{width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 2px #E7B53C,0 0 30px rgba(198,38,51,.5)}
  #splash p{margin:0;color:#BDA38D}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="Real Monsters alliance logo"><p id="splash-msg">Loading…</p></div>
<iframe id="app" title="Ahhhh! Real MVPs" allow="clipboard-write"></iframe>
<script>
  // Paste your Apps Script Web app URL (it ends in /exec) between the quotes:
  var APP_URL = "PASTE-YOUR-WEB-APP-URL-HERE";

  var frame = document.getElementById("app"), splash = document.getElementById("splash");
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
    document.getElementById("splash-msg").textContent = "Almost there: paste the Web app URL into index.html.";
  } else {
    frame.addEventListener("load", function () { splash.style.opacity = "0"; setTimeout(function () { splash.remove(); }, 450); });
    frame.src = APP_URL;
  }
</script>
</body>
